name: RealityCart
options:
  bundleIdPrefix: com.realitycart
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  RealityCart:
    type: application
    platform: iOS
    sources:
      - path: RealityCart
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.realitycart.app
        INFOPLIST_FILE: RealityCart/Info.plist
        DEVELOPMENT_TEAM: G8F9227PUA
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        ENABLE_PREVIEWS: YES
    dependencies:
      - sdk: RoomPlan.framework
      - sdk: RealityKit.framework
      - sdk: ARKit.framework
      - sdk: Speech.framework
      - sdk: AVFoundation.framework
